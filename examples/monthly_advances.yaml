# ČEZ Dynamic Tariff & Accounting >= 1.0.4, accounting enabled.
# The bundled card loads after updating the integration and refreshing HA.
type: conditional
conditions:
  - condition: state
    entity: binary_sensor.cez_dynamic_tariff_advance_editor_available
    state: "on"
card:
  type: custom:cez-advances-card
  entity: sensor.cez_dynamic_tariff_accounting_status
  title: Zálohy
grid_options:
  columns: full
