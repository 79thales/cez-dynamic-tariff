name: Prepare release installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match manifest.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-installer-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Run unit tests
        working-directory: release-source
        run: python -m unittest discover -s tests -v
      - name: Compile integration and packaging script
        run: python -m compileall -q release-source/custom_components/cez_dynamic_tariff scripts
      - name: Build and validate installer from the tagged commit
        run: python scripts/build_release.py --repository release-source --ref HEAD --expected-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-installer
          path: |
            dist/cez_dynamic_tariff.zip
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: release-installer
          path: dist
      - name: Attach draft installer or verify published installer without changes
        uses: actions/github-script@v8
        with:
          script: |
            const { attachInstaller } = require('./scripts/attach_release_installer.cjs');
            await attachInstaller({ github, context, core, tag: process.env.RELEASE_TAG });
