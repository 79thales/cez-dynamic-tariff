name: Prepare release installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match manifest.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-installer-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile integration and packaging script
        run: python -m compileall -q custom_components/cez_dynamic_tariff scripts
      - name: Build and validate installer from the tagged commit
        run: python scripts/build_release.py --ref HEAD --expected-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-installer
          path: |
            dist/cez_dynamic_tariff.zip
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-installer
          path: dist
      - name: Attach installer to a draft, without publishing or replacing assets
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const tag = process.env.RELEASE_TAG;
            const data = fs.readFileSync('dist/cez_dynamic_tariff.zip');
            const digest = `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`;
            const name = 'cez_dynamic_tariff.zip';
            // Listing with the write token includes drafts, making reruns safe.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            let release = releases.find(item => item.tag_name === tag);
            if (!release) {
              release = (await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                name: tag,
                body: fs.readFileSync('dist/release-notes.md', 'utf8'),
                draft: true,
                prerelease: tag.includes('-')
              })).data;
            }
            if (!release.draft) {
              throw new Error('This release is already published. Refusing to change its assets.');
            }
            const existing = release.assets.find(asset => asset.name === name);
            if (existing) {
              if (existing.digest !== digest || existing.size !== data.length) {
                throw new Error('Existing installer differs. Refusing to overwrite it or reset its download count.');
              }
              core.notice('Identical installer already attached; no changes made.');
            } else {
              const asset = (await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data,
                headers: { 'content-type': 'application/zip' }
              })).data;
              if (asset.state !== 'uploaded' || asset.size !== data.length || asset.digest !== digest) {
                throw new Error('Uploaded installer failed size or SHA-256 verification. Keep the release as a draft.');
              }
            }
            await core.summary
              .addHeading('Installer ready; release is still a draft')
              .addLink(tag, release.html_url)
              .addRaw('\nReview the bilingual notes and Quality, HACS and Hassfest results before publishing.\n')
              .write();
