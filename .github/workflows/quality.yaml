name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff coverage

      - name: Compile Python sources
        run: python -m compileall -q custom_components tests tests_homeassistant

      - name: Run Ruff
        run: ruff check custom_components tests tests_homeassistant

      - name: Run tests
        run: coverage run --source=custom_components/cez_dynamic_tariff -m unittest discover -s tests

      - name: Unit-test coverage
        run: coverage report --show-missing

  home-assistant:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2025.1.4"
            test_plugin: "0.13.205"
            python: "3.12"
          - homeassistant: "2026.8.3"
            test_plugin: "0.13.357"
            python: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install matching Home Assistant test environment
        run: >-
          python -m pip install
          homeassistant==${{ matrix.homeassistant }}
          pytest-homeassistant-custom-component==${{ matrix.test_plugin }}
          pytest-cov
          holidays==0.93

      - name: Run real Home Assistant lifecycle tests
        run: >-
          pytest tests_homeassistant -q
          --cov=custom_components.cez_dynamic_tariff
          --cov-report=term-missing
