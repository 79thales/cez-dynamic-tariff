name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-home-assistant:
    name: Resolve latest stable Home Assistant
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Resolve stable HA and matching test plugin from PyPI
        id: resolve
        run: echo "environment=$(python scripts/resolve_latest_ha.py)" >> "$GITHUB_OUTPUT"

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install -r requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall -q custom_components tests tests_homeassistant scripts

      - name: Run Ruff
        run: ruff check custom_components tests tests_homeassistant scripts

      - name: Run tests
        run: coverage run --source=custom_components/cez_dynamic_tariff -m unittest discover -s tests

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test dashboard view creation
        run: node --test tests/test_dashboard_frontend.js

      - name: Unit-test coverage
        run: coverage report --show-missing

  home-assistant:
    name: Home Assistant ${{ matrix.homeassistant }}
    needs: latest-home-assistant
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2025.1.4"
            test_plugin: "0.13.205"
            python: "3.12"
            holidays: "holidays==0.106"
          - homeassistant: "2026.8.3"
            test_plugin: "0.13.357"
            python: "3.14"
            holidays: "holidays==0.106"
          - homeassistant: ${{ fromJSON(needs.latest-home-assistant.outputs.environment).homeassistant }}
            test_plugin: ${{ fromJSON(needs.latest-home-assistant.outputs.environment).test_plugin }}
            python: ${{ fromJSON(needs.latest-home-assistant.outputs.environment).python }}
            holidays: "holidays>=0.106"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install matching Home Assistant test environment
        run: >-
          python -m pip install
          homeassistant==${{ matrix.homeassistant }}
          pytest-homeassistant-custom-component==${{ matrix.test_plugin }}
          pytest-cov
          "${{ matrix.holidays }}"
          "pypdf==6.19.0"

      - name: Run real Home Assistant lifecycle tests
        run: >-
          pytest tests_homeassistant -q
          --cov=custom_components.cez_dynamic_tariff
          --cov-report=term-missing
